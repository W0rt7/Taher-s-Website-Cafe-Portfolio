<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animanga Scene</title>
  <link rel="icon" type="image/jpeg" href="%20.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages.css">
  <style>
    body {
      background: linear-gradient(135deg, #87CEEB 0%, #E0BBE4 50%, #FADADD 100%);
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
      position: relative;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .animanga-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .animanga-image {
      max-width: 80%;
      max-height: 80vh;
      width: auto;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="animanga-container">
    <img src="ANIMANGASCENERY.gif" alt="Animanga Scene pixel art" class="animanga-image">
  </div>
</body>
</html>
